<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parental Control</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05060f;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:50% 50%;overflow:hidden;
  background:radial-gradient(1200px 900px at 15% 0%,#3b2a8f 0%,transparent 60%),radial-gradient(1000px 900px at 100% 100%,#0e6b8a 0%,transparent 60%),linear-gradient(160deg,#151a3d,#0a0d22);color:#fff}
.glow{position:absolute;width:700px;height:700px;border-radius:50%;filter:blur(120px);opacity:.35;background:#7a5cff;left:-200px;top:900px;animation:float 6s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(300px,-300px)}}

/* notifications */
.card{position:absolute;left:70px;width:940px;height:200px;border-radius:44px;padding:0 40px;display:flex;align-items:center;gap:34px;
  background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 30px 60px rgba(0,0,0,.35);opacity:0;transform:translateX(120%);transition:transform .9s cubic-bezier(.2,1.15,.4,1),opacity .7s}
.card.in{opacity:1;transform:none}
.card.out{opacity:0;transform:translateY(-80px) scale(.9);transition:transform .7s cubic-bezier(.5,0,.7,.4),opacity .6s}
.card.locked{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08)}
.card.locked .ic,.card.locked .txt{opacity:.45;filter:grayscale(.6);transition:.4s}
.ic{width:120px;height:120px;border-radius:32px;display:grid;place-items:center;flex:none}
.ic svg{width:66px;height:66px;fill:#fff}
.g{background:linear-gradient(135deg,#ff5f6d,#ff2e93)}
.v{background:linear-gradient(135deg,#ffb347,#ff6a00)}
.m{background:linear-gradient(135deg,#3ee0ff,#3f6bff)}
.txt{flex:1}
.t1{font-size:50px;font-weight:700;letter-spacing:-.5px}
.t2{margin-top:10px;display:flex;align-items:center;gap:16px;font-size:40px;font-weight:600;color:#ff6b7f}
.bar{height:12px;flex:1;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;max-width:260px}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#ff9a3c,#ff3d6e);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.card.in .bar i{width:var(--w)}
.lock{width:130px;height:130px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
  background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.35);transition:background .3s,border-color .3s,transform .2s}
.lock svg{width:66px;height:66px;overflow:visible}
.lock .sh{transition:transform .35s cubic-bezier(.3,1.6,.5,1);transform:translateY(-14px) rotate(0deg);transform-origin:44px 30px}
.lock.closed{background:linear-gradient(135deg,#22e39b,#10b07a);border-color:#7dffd0;box-shadow:0 0 50px rgba(34,227,155,.6)}
.lock.closed .sh{transform:none}
.lock.press{transform:scale(.86)}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(255,255,255,.08)}}

/* time panel */
.panel{position:absolute;left:70px;top:330px;width:940px;height:560px;border-radius:56px;padding:60px 60px;
  background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.16);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 40px 80px rgba(0,0,0,.4);opacity:0;transform:scale(.85) translateY(40px);transition:transform .5s cubic-bezier(.2,1.3,.4,1),opacity .35s}
.panel.in{opacity:1;transform:none}
.ph{display:flex;align-items:center;gap:28px}
.clock{width:110px;height:110px;border-radius:30px;background:linear-gradient(135deg,#8b6cff,#4f7bff);display:grid;place-items:center}
.clock svg{width:64px;height:64px}
.ptitle{font-size:58px;font-weight:800;letter-spacing:-1px}
.row{position:absolute;left:60px;right:60px;top:290px;display:flex;align-items:center;gap:36px}
.disp{flex:1;height:180px;border-radius:40px;background:rgba(0,0,0,.28);border:3px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;gap:18px;
  font-size:110px;font-weight:800;transition:border-color .3s,box-shadow .3s}
.disp.focus{border-color:#8b6cff;box-shadow:0 0 0 8px rgba(139,108,255,.25)}
.disp.ok{border-color:#22e39b;box-shadow:0 0 0 8px rgba(34,227,155,.25)}
.num{min-width:60px;text-align:right;display:inline-block}
.num.pop{animation:pop .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(1.6);opacity:0}}
.caret{width:6px;height:100px;background:#fff;border-radius:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.unit{font-size:64px;opacity:.6;font-weight:700}
.chk{width:180px;height:180px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
  background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.3);transition:background .3s,transform .18s,box-shadow .3s}
.chk.ready{background:linear-gradient(135deg,#8b6cff,#4f7bff);border-color:#b7a6ff}
.chk.done{background:linear-gradient(135deg,#22e39b,#10b07a);border-color:#7dffd0;box-shadow:0 0 70px rgba(34,227,155,.7)}
.chk.press{transform:scale(.86)}
.chk svg{width:90px;height:90px}

/* keypad */
.pad{position:absolute;left:0;right:0;bottom:0;height:780px;border-radius:64px 64px 0 0;padding:70px 60px 0;
  background:rgba(15,18,45,.88);border-top:2px solid rgba(255,255,255,.12);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:150px;gap:24px;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,1,.3,1)}
.pad.in{transform:none}
.key{border-radius:36px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:72px;font-weight:600;transition:background .2s,transform .15s}
.key.blank{background:none}
.key.press{background:rgba(139,108,255,.75);transform:scale(.92)}

/* success */
.done-badge{position:absolute;left:50%;top:1250px;width:320px;height:320px;margin-left:-160px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,#22e39b,#10b07a);box-shadow:0 0 120px rgba(34,227,155,.55);opacity:0;transform:scale(.3);transition:transform .5s cubic-bezier(.2,1.6,.4,1),opacity .3s}
.done-badge.in{opacity:1;transform:none}
.done-badge svg{width:170px;height:170px}
.mini{position:absolute;top:1640px;left:50%;display:flex;gap:40px;transform:translateX(-50%)}
.mini div{width:120px;height:120px;border-radius:32px;display:grid;place-items:center;position:relative;opacity:0;transform:translateY(40px);transition:.4s cubic-bezier(.2,1.4,.4,1)}
.mini.in div{opacity:1;transform:none}
.mini svg{width:62px;height:62px;fill:#fff}
.mini b{position:absolute;right:-14px;bottom:-14px;width:56px;height:56px;border-radius:50%;background:#10b07a;border:4px solid #0e1230;display:grid;place-items:center}
.mini b svg{width:28px;height:28px}

.ripple{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:5px solid rgba(255,255,255,.9);pointer-events:none;animation:rip .5s ease-out forwards}
@keyframes rip{to{transform:scale(5);opacity:0}}

.hand{position:absolute;left:0;top:0;width:720px;pointer-events:none;z-index:50;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45));
  transform-origin:0 0;will-change:transform}
.hand img{width:100%;display:block;transform-origin:96% 18%;transition:transform .12s}
.hand.tap img{transform:scale(.93) rotate(-2deg)}
.fade{position:absolute;inset:0;background:#0a0d22;opacity:0;pointer-events:none;z-index:60;transition:opacity .35s}
.fade.on{opacity:1}
</style>
</head>

  <div class="fade" id="fade"></div>

</div>
<script>
const W=1080,H=1920,st=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);st.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hand=$('hand');
// fingertip position inside the 720px-wide hand image (source 611x318, tip at ~605,57)
const TIP={x:720*603/611,y:720*57/611};
let hx=-900,hy=2200;
function place(x,y,ms,ease){hand.style.transition=ms?`transform ${ms}ms ${ease||'cubic-bezier(.45,0,.2,1)'}`:'none';
  hx=x;hy=y;hand.style.transform=`translate(${x-TIP.x}px,${y-TIP.y}px) rotate(-6deg)`;}
function center(el){let x=el.offsetWidth/2,y=el.offsetHeight/2;let e=el;while(e&&e!==st){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent;}return{x,y};}
function ripple(x,y){const r=document.createElement('div');r.className='ripple';r.style.left=x+'px';r.style.top=y+'px';st.appendChild(r);setTimeout(()=>r.remove(),600);}
async function tap(el,onTap){const c=center(el);hand.classList.add('tap');el.classList.add('press');ripple(c.x,c.y);onTap&&onTap();
  await sleep(140);hand.classList.remove('tap');el.classList.remove('press');}
async function goTap(el,move,onTap){const c=center(el);place(c.x,c.y,move);await sleep(move);await tap(el,onTap);}

function reset(){
  ['c0','c1','c2'].forEach(i=>$(i).className='card');
  ['l0','l1','l2'].forEach(i=>$(i).className='lock');
  $('panel').className='panel';$('pad').className='pad';$('badge').className='done-badge';$('mini').className='mini';
  $('num').textContent='';$('num').className='num';$('caret').style.display='';$('disp').className='disp';$('chk').className='chk';
  place(-200,2300,0);
}
async function run(){
  const t0=performance.now();
  reset();$('fade').classList.remove('on');
  await sleep(150);
  for(let i=0;i<3;i++){$('c'+i).classList.add('in');await sleep(280);}
  await sleep(450);           // ~0.6s
  ['l0','l1','l2'].forEach(i=>$(i).classList.add('pulse'));
  await sleep(150);
  // locks one by one
  for(let i=0;i<3;i++){const l=$('l'+i);await goTap(l,i?320:480,()=>{l.classList.remove('pulse');l.classList.add('closed');$('c'+i).classList.add('locked');});await sleep(110);}
  // ~2.7s : hand dips away, cards out, panel in
  place(hx-120,hy+700,380);
  await sleep(250);
  for(let i=0;i<3;i++){$('c'+i).classList.add('out');await sleep(150);}
  await sleep(450);
  $('panel').classList.add('in');$('disp').classList.add('focus');
  await sleep(220);
  $('pad').classList.add('in');
  await sleep(380);
  // tap 3
  await goTap($('k3'),520,()=>{$('caret').style.display='none';$('num').textContent='3';$('num').classList.add('pop');$('chk').classList.add('ready');});
  await sleep(250);
  // tap check
  await goTap($('chk'),480,()=>{$('chk').classList.add('done');$('disp').classList.remove('focus');$('disp').classList.add('ok');});
  await sleep(260);
  // finish
  place(-300,2400,500,'ease-in');
  $('pad').classList.remove('in');
  await sleep(250);
  $('badge').classList.add('in');
  await sleep(250);
  $('mini').classList.add('in');
  // hold until 9.6s then fade, loop at 10s
  const left=9600-(performance.now()-t0);if(left>0)await sleep(left);
  $('fade').classList.add('on');
  const left2=10000-(performance.now()-t0);if(left2>0)await sleep(left2);
  run();
}
run();
</script>
